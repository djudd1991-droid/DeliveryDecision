name: Build Delivery Decision v0.2.8
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip Android project
        run: unzip -o DeliveryDecision_v0.2.8_project.zip -d project
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Build APK
        working-directory: project
        run: gradle :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: DeliveryDecision-v0.2.8-APK
          path: project/app/build/outputs/apk/debug/app-debug.apk
