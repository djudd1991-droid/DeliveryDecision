name: Build Delivery Decision v0.2

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unzip Android project
        run: |
          unzip -o DeliveryDecision_v0.2_project.zip -d project
          if [ -f delivery_decision_icon.png ]; then
           rm -f project/app/src/main/res/drawable/
           app_icon.xml
           cp delivery_decision_icon.png project/app/src/main/res/drawable/app_icon.png
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Build APK
        working-directory: project
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DeliveryDecision-v0.2-APK
          path: project/app/build/outputs/apk/debug/app-debug.apk
