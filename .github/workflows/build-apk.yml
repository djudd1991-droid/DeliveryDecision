name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Create Android project
        run: |
          mkdir -p app/src/main/java/com/deliverydecision
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/xml

          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "DeliveryDecision"
          include(":app")
          EOF

          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.13.0" apply false
              id("org.jetbrains.kotlin.android") version "2.2.20" apply false
          }
          EOF

          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.deliverydecision"
              compileSdk = 36

              defaultConfig {
                  applicationId = "com.deliverydecision"
                  minSdk = 26
                  targetSdk = 36
                  versionCode = 1
                  versionName = "0.1"
              }
          }
          EOF

          cat > app/src/main/res/values/strings.xml <<'EOF'
          <resources>
              <string name="app_name">Delivery Decision</string>
              <string name="accessibility_description">Reads visible delivery offer text and provides a TAKE, CONSIDER, or PASS recommendation.</string>
          </resources>
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="AppTheme" parent="android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:colorAccent">#222222</item>
              </style>
          </resources>
          EOF

          cat > app/src/main/res/xml/accessibility_service_config.xml <<'EOF'
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeWindowStateChanged|typeWindowContentChanged|typeViewTextChanged"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:canRetrieveWindowContent="true"
              android:notificationTimeout="100"
              android:description="@string/accessibility_description" />
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:theme="@style/AppTheme"
                  android:label="@string/app_name"
                  android:allowBackup="false">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".OfferReaderService"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE"
                      android:exported="false"
                      android:label="@string/app_name">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService" />
                      </intent-filter>
                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/accessibility_service_config" />
                  </service>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/deliverydecision/MainActivity.kt <<'EOF'
          package com.deliverydecision

          import android.app.Activity
          import android.os.Bundle
          import android.content.Intent
          import android.provider.Settings
          import android.graphics.Color
          import android.widget.*

          class MainActivity : Activity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  val layout = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(32, 48, 32, 32)
                  }

                  layout.addView(TextView(this).apply {
                      text = "Delivery Decision v0.1"
                      textSize = 26f
                      setTextColor(Color.BLACK)
                  })

                  layout.addView(TextView(this).apply {
                      text = """
                          Reads visible DoorDash/Uber Eats offer text and shows TAKE, CONSIDER, or PASS.

                          Starting rules:
                          • 20 MPG
                          • $3.99/gal
                          • $1.50/mile minimum
                          • $2.00/mile preferred
                          • $25/hr target

                          You make the final Accept/Decline decision.
                      """.trimIndent()
                      textSize = 17f
                      setTextColor(Color.DKGRAY)
                  })

                  layout.addView(Button(this).apply {
                      text = "Enable Offer Reader"
                      setOnClickListener {
                          startActivity(Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS))
                      }
                  })

                  setContentView(layout)
              }
          }
          EOF

          cat > app/src/main/java/com/deliverydecision/OfferReaderService.kt <<'EOF'
          package com.deliverydecision

          import android.accessibilityservice.AccessibilityService
          import android.view.accessibility.AccessibilityEvent
          import android.view.accessibility.AccessibilityNodeInfo
          import android.graphics.Color
          import android.graphics.PixelFormat
          import android.view.WindowManager
          import android.widget.TextView
          import android.view.Gravity
          import android.os.Handler
          import android.os.Looper
          import java.util.regex.Pattern
          import kotlin.math.max

          class OfferReaderService : AccessibilityService() {
              private var overlay: TextView? = null
              private val handler = Handler(Looper.getMainLooper())
              private var lastText = ""

              override fun onAccessibilityEvent(event: AccessibilityEvent?) {
                  val pkg = event?.packageName?.toString() ?: return

                  if (pkg != "com.doordash.driverapp" && pkg != "com.ubercab") {
                      hideOverlay()
                      return
                  }

                  val root = rootInActiveWindow ?: return
                  val text = collectText(root)

                  if (text == lastText || text.length < 5) return
                  lastText = text

                  val offer = OfferParser.parse(text) ?: return
                  showDecision(pkg, offer)
              }

              private fun collectText(node: AccessibilityNodeInfo): String {
                  val out = StringBuilder()

                  fun walk(n: AccessibilityNodeInfo?) {
                      if (n == null) return
                      n.text?.let { out.append(it).append(" ") }
                      n.contentDescription?.let { out.append(it).append(" ") }
                      for (i in 0 until n.childCount) {
                          walk(n.getChild(i))
                      }
                  }

                  walk(node)
                  return out.toString()
              }

              private fun showDecision(pkg: String, offer: Offer) {
                  val dollarsPerMile = offer.pay / max(offer.miles, 0.1)

                  val decision = when {
                      dollarsPerMile >= 2.0 -> "TAKE"
                      dollarsPerMile >= 1.5 -> "CONSIDER"
                      else -> "PASS"
                  }

                  val icon = when (decision) {
                      "TAKE" -> "🟢"
                      "PASS" -> "🔴"
                      else -> "🟡"
                  }

                  val app = if (pkg.contains("doordash")) "DoorDash" else "Uber Eats"

                  val msg =
                      "$icon $decision\n$app  $${"%.2f".format(offer.pay)} • ${"%.1f".format(offer.miles)} mi\n$${"%.2f".format(dollarsPerMile)}/mile"

                  handler.post {
                      if (overlay == null) {
                          overlay = TextView(this).apply {
                              textSize = 15f
                              setTextColor(Color.WHITE)
                              setPadding(18, 12, 18, 12)
                              setBackgroundColor(Color.argb(225, 25, 25, 25))
                          }

                          val params = WindowManager.LayoutParams(
                              WindowManager.LayoutParams.WRAP_CONTENT,
                              WindowManager.LayoutParams.WRAP_CONTENT,
                              WindowManager.LayoutParams.TYPE_ACCESSIBILITY_OVERLAY,
                              WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or
                                  WindowManager.LayoutParams.FLAG_NOT_TOUCHABLE,
                              PixelFormat.TRANSLUCENT
                          ).apply {
                              gravity = Gravity.TOP or Gravity.CENTER_HORIZONTAL
                              y = 120
                          }

                          getSystemService(WindowManager::class.java)
                              .addView(overlay, params)
                      }

                      overlay?.text = msg
                      handler.removeCallbacksAndMessages(null)
                      handler.postDelayed({ hideOverlay() }, 7000)
                  }
              }

              private fun hideOverlay() {
                  handler.post {
                      overlay?.let {
                          runCatching {
                              getSystemService(WindowManager::class.java)
                                  .removeView(it)
                          }
                      }
                      overlay = null
                  }
              }

              override fun onInterrupt() = Unit
          }

          data class Offer(
              val pay: Double,
              val miles: Double
          )

          object OfferParser {
              private val money =
                  Pattern.compile("\\$(\\d+(?:\\.\\d{1,2})?)")

              private val miles =
                  Pattern.compile("(\\d+(?:\\.\\d+)?)\\s*(?:mi|miles)")

              fun parse(text: String): Offer? {
                  val moneyMatch = money.matcher(text)
                  val milesMatch = miles.matcher(text)

                  if (!moneyMatch.find() || !milesMatch.find()) return null

                  val pay =
                      moneyMatch.group(1)?.toDoubleOrNull() ?: return null

                  val distance =
                      milesMatch.group(1)?.toDoubleOrNull() ?: return null

                  if (pay <= 0 || distance <= 0 || pay > 500 || distance > 200) {
                      return null
                  }

                  return Offer(pay, distance)
              }
          }
          EOF

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Build APK
        run: gradle :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DeliveryDecision-APK
          path: app/build/outputs/apk/debug/app-debug.apk
